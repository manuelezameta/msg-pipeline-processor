# =============================================================================
# template.yaml — AWS SAM — msg-pipeline-processor-sesion-08
# =============================================================================
#
# SESIÓN 08: SAM + S3 + GitHub Actions
#
# ARQUITECTURA IMPLEMENTADA:
#   POST /messages-s8
#       └─> API Gateway (Integración Nativa SendMessage)
#           └─> SQS Cola Principal (msg-pipeline-queue-sesion-08)
#               ├─> DLQ (msg-pipeline-dlq-sesion-08)  [maxReceiveCount=3]
#               └─> Event Source Mapping
#                   └─> Lambda: ProcessorHandler
#                       └─> DynamoDB PutItem (msg-pipeline-messages-sesion-08)
#
# REGLA DE NOMENCLATURA: Todos los recursos físicos incluyen el sufijo "-sesion-08"
#
#
# DESPLIEGUE MANUAL (primera vez):
#   sam build
#   sam deploy --guided
#
# DESPLIEGUE AUTOMÁTICO: Gestionado por GitHub Actions (.github/workflows/deploy.yml)
# =============================================================================

AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: >
  msg-pipeline-processor-sesion-08
  Pipeline de mensajería serverless - SAM + GitHub Actions (Sesión 08)

# =============================================================================
# PARÁMETROS — valores configurables en el despliegue
# =============================================================================
Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, prod]
    Description: Entorno de despliegue

  ArtifactsBucketName:
    Type: String
    Default: msg-pipeline-artifacts-629742034427
    Description: Bucket S3 donde SAM sube los artefactos compilados

# =============================================================================
# GLOBALS — configuración compartida por todas las funciones Lambda
# =============================================================================
Globals:
  Function:
    # Java + Spring Boot tienen Cold Start lento (~5-15s la primera vez).
    # 60 segundos de timeout nos da margen suficiente para Cold Start + procesamiento.
    # CRÍTICO: Si el Timeout es menor al Cold Start → TimeoutError desde el inicio.
    Timeout: 60

    # 512 MB es el mínimo recomendado para Spring Boot en Lambda.
    # Con menos memoria, el JVM tiene poco espacio → Cold Start más lento
    # y posibles OutOfMemoryError.
    MemorySize: 512

    # Runtime de Java 17 (LTS compatible con Spring Boot 3.5)
    Runtime: java17

    # Arquitectura ARM64 (Graviton2): hasta 20% más rápido y 20% más barato que x86_64
    Architectures:
      - arm64

    # Variables de entorno comunes a todas las Lambdas
    Environment:
      Variables:
        SPRING_PROFILES_ACTIVE: aws
        AWS_REGION_NAME: !Ref AWS::Region

# =============================================================================
# RECURSOS
# =============================================================================
Resources:

  # ---------------------------------------------------------------------------
  # 1. IAM Role para que API Gateway escriba logs en CloudWatch
  # ---------------------------------------------------------------------------
  # CONCEPTO: API Gateway necesita un rol IAM para poder escribir en CloudWatch
  # Logs. Este rol debe configurarse UNA vez a nivel de cuenta mediante el
  # recurso AWS::ApiGateway::Account. Sin esta configuración, cualquier Stage
  # que intente activar logging falla con "CloudWatch Logs role ARN must be set".
  #
  # LECCIÓN APRENDIDA DEL ERROR:
  #   El error original fue: MethodSettings con LoggingLevel: INFO en el Stage
  #   sin haber configurado este rol a nivel de cuenta. CloudFormation detecta
  #   la inconsistencia y falla con ROLLBACK_COMPLETE.
  # ---------------------------------------------------------------------------
  ApiGatewayCloudWatchRoleSesion08:
    Type: AWS::IAM::Role
    Properties:
      RoleName: msg-pipeline-apigw-cw-role-sesion-08
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      # AmazonAPIGatewayPushToCloudWatchLogs: política administrada de AWS
      # que otorga a API Gateway los permisos necesarios para escribir logs
      # en CloudWatch (CreateLogGroup, CreateLogStream, PutLogEvents, etc.)
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs

  # ---------------------------------------------------------------------------
  # 2. Configuración de cuenta de API Gateway — CloudWatch Logs Role
  # ---------------------------------------------------------------------------
  # CONCEPTO: AWS::ApiGateway::Account es un recurso singleton (uno por cuenta
  # y región). Vincula el rol IAM con la configuración global de API Gateway,
  # permitiendo que cualquier Stage active logging sin error.
  #
  # IMPORTANTE: Si ya existe una configuración de cuenta previa, este recurso
  # la SOBRESCRIBE. En el contexto del curso, esto es seguro porque el rol
  # que asignamos tiene exactamente los permisos necesarios.
  # ---------------------------------------------------------------------------
  ApiGatewayAccountConfigSesion08:
    Type: AWS::ApiGateway::Account
    DependsOn: ApiGatewayCloudWatchRoleSesion08
    Properties:
      CloudWatchRoleArn: !GetAtt ApiGatewayCloudWatchRoleSesion08.Arn

  # ---------------------------------------------------------------------------
  # 3. DynamoDB — Tabla de mensajes
  # ---------------------------------------------------------------------------
  MsgPipelineMessageTableSesion08:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: msg-pipeline-messages-sesion-08
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: messageId
          AttributeType: S
      KeySchema:
        - AttributeName: messageId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ---------------------------------------------------------------------------
  # 4. SQS — Dead Letter Queue (DLQ)
  # ---------------------------------------------------------------------------
  # ORDEN: La DLQ debe crearse ANTES de la cola principal porque
  # la cola principal referencia la DLQ en su RedrivePolicy.
  # ---------------------------------------------------------------------------
  MsgPipelineDLQSesion08:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: msg-pipeline-dlq-sesion-08
      # Los mensajes en la DLQ se retienen 14 días para análisis y re-procesamiento.
      MessageRetentionPeriod: 1209600  # 14 días en segundos

  # ---------------------------------------------------------------------------
  # 5. SQS — Cola principal
  # ---------------------------------------------------------------------------
  MsgPipelineQueueSesion08:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: msg-pipeline-queue-sesion-08
      # VisibilityTimeout >= 6 * Lambda.Timeout (best practice AWS)
      # 60s * 6 = 360s
      VisibilityTimeout: 360
      MessageRetentionPeriod: 345600  # 4 días en segundos
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt MsgPipelineDLQSesion08.Arn
        # Después de 3 fallos consecutivos → mensaje va a la DLQ
        maxReceiveCount: 3

  # ---------------------------------------------------------------------------
  # 6. IAM Role — Permisos para API Gateway → SQS
  # ---------------------------------------------------------------------------
  ApiGatewaySQSRoleSesion08:
    Type: AWS::IAM::Role
    Properties:
      RoleName: msg-pipeline-apigw-sqs-role-sesion-08
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AllowSQSSendMessage
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt MsgPipelineQueueSesion08.Arn

  # ---------------------------------------------------------------------------
  # 7. API Gateway — REST API con integración nativa a SQS
  # ---------------------------------------------------------------------------
  MsgPipelineApiSesion08:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: msg-pipeline-api-sesion-08
      Description: API Gateway con integración directa a SQS - Sesión 08
      EndpointConfiguration:
        Types:
          - REGIONAL

  # Recurso /messages-s8
  MsgPipelineApiResourceSesion08:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MsgPipelineApiSesion08
      ParentId: !GetAtt MsgPipelineApiSesion08.RootResourceId
      PathPart: messages-s8

  # Método POST /messages-s8 con integración directa a SQS
  MsgPipelineApiMethodSesion08:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MsgPipelineApiSesion08
      ResourceId: !Ref MsgPipelineApiResourceSesion08
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS
        IntegrationHttpMethod: POST
        Uri: !Sub
          - arn:aws:apigateway:${AWS::Region}:sqs:path/${AWS::AccountId}/${QueueName}
          - QueueName: !GetAtt MsgPipelineQueueSesion08.QueueName
        Credentials: !GetAtt ApiGatewaySQSRoleSesion08.Arn
        RequestParameters:
          integration.request.header.Content-Type: "'application/x-www-form-urlencoded'"
        RequestTemplates:
          application/json: |
            Action=SendMessage&MessageBody=$util.urlEncode($input.body)
        IntegrationResponses:
          - StatusCode: 202
            ResponseTemplates:
              application/json: |
                #set($body = $input.path('$'))
                {
                  "messageId": "$context.requestId",
                  "status": "ACCEPTED",
                  "message": "Mensaje encolado exitosamente",
                  "queue": "msg-pipeline-queue-sesion-08",
                  "timestamp": "$context.requestTimeEpoch"
                }
      MethodResponses:
        - StatusCode: 202
          ResponseModels:
            application/json: Empty

  # Deployment del API Gateway
  MsgPipelineApiDeploymentSesion08:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - MsgPipelineApiMethodSesion08
    Properties:
      RestApiId: !Ref MsgPipelineApiSesion08

  # ---------------------------------------------------------------------------
  # 8. API Gateway Stage — FIX v2: logging activado SOLO después de configurar
  #    AWS::ApiGateway::Account. DependsOn garantiza el orden correcto.
  # ---------------------------------------------------------------------------
  # CAUSA DEL ERROR ANTERIOR:
  #   El Stage anterior intentaba activar LoggingLevel: INFO sin que existiera
  #   el AWS::ApiGateway::Account con el CloudWatch Role ARN configurado.
  #   CloudFormation no pudo crear el Stage → ROLLBACK de todo el stack.
  #
  # SOLUCIÓN APLICADA:
  #   1. Se añadió ApiGatewayCloudWatchRoleSesion08 (IAM Role para CW)
  #   2. Se añadió ApiGatewayAccountConfigSesion08 (AWS::ApiGateway::Account)
  #   3. El Stage ahora tiene DependsOn: ApiGatewayAccountConfigSesion08
  #      para garantizar que la cuenta esté configurada antes de crear el Stage.
  # ---------------------------------------------------------------------------
  MsgPipelineApiStageSesion08:
    Type: AWS::ApiGateway::Stage
    # CRÍTICO: el Stage debe crearse DESPUÉS de configurar la cuenta de API GW
    DependsOn:
      - ApiGatewayAccountConfigSesion08
    Properties:
      RestApiId: !Ref MsgPipelineApiSesion08
      DeploymentId: !Ref MsgPipelineApiDeploymentSesion08
      StageName: prod
      Description: Stage de producción - Sesión 08
      # Logging activado — ahora funciona porque AWS::ApiGateway::Account
      # ya configuró el CloudWatch Logs Role ARN a nivel de cuenta.
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          LoggingLevel: INFO
          MetricsEnabled: true
          DataTraceEnabled: false

  # ---------------------------------------------------------------------------
  # 9. Lambda — msg-pipeline-processor-sesion-08
  # ---------------------------------------------------------------------------
  MsgPipelineProcessorSesion08:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: msg-pipeline-processor-sesion-08
      CodeUri: build/distributions/msg-pipeline-processor-lambda.zip
      # Handler: clase completa + método
      Handler: com.msgpipeline.processor.ProcessorHandler::handleRequest
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: msg-pipeline-messages-sesion-08
      # SAM Policy Templates: abstracciones de alto nivel que generan políticas IAM
      Policies:
        - SQSPollerPolicy:
            QueueName: !GetAtt MsgPipelineQueueSesion08.QueueName
        - DynamoDBWritePolicy:
            TableName: !Ref MsgPipelineMessageTableSesion08
      Events:
        SQSTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt MsgPipelineQueueSesion08.Arn
            BatchSize: 1
            Enabled: true

# =============================================================================
# OUTPUTS — valores exportados para referencia
# =============================================================================
Outputs:
  ApiEndpointSesion08:
    Description: "URL del endpoint POST /messages-s8"
    Value: !Sub "https://${MsgPipelineApiSesion08}.execute-api.${AWS::Region}.amazonaws.com/prod/messages-s8"
    Export:
      Name: MsgPipelineApiEndpointSesion08

  QueueUrlSesion08:
    Description: "URL de la cola SQS principal"
    Value: !Ref MsgPipelineQueueSesion08
    Export:
      Name: MsgPipelineQueueUrlSesion08

  DLQUrlSesion08:
    Description: "URL de la Dead Letter Queue"
    Value: !Ref MsgPipelineDLQSesion08
    Export:
      Name: MsgPipelineDLQUrlSesion08

  LambdaFunctionArnSesion08:
    Description: "ARN de la función Lambda"
    Value: !GetAtt MsgPipelineProcessorSesion08.Arn
    Export:
      Name: MsgPipelineLambdaArnSesion08

  DynamoTableNameSesion08:
    Description: "Nombre de la tabla DynamoDB"
    Value: !Ref MsgPipelineMessageTableSesion08
    Export:
      Name: MsgPipelineDynamoTableSesion08

  CloudWatchRoleArnSesion08:
    Description: "ARN del IAM Role de API Gateway para CloudWatch Logs"
    Value: !GetAtt ApiGatewayCloudWatchRoleSesion08.Arn
    Export:
      Name: MsgPipelineApiGwCWRoleArnSesion08

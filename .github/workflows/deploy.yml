# =============================================================================
# deploy.yml — GitHub Actions CI/CD Pipeline
# =============================================================================
#
# SESIÓN 08: SAM + S3 + GitHub Actions
# PROYECTO: msg-pipeline-processor-sesion-08
#
# FLUJO COMPLETO:
#   Push a rama 'main'
#   └─> Checkout del código
#       └─> Configurar credenciales AWS via OIDC (sin access keys)
#           └─> Setup Java 17 + Gradle
#               └─> Compilar y generar ZIP (./gradlew buildZip)
#                   └─> sam build
#                       └─> sam deploy (a S3 + Lambda + API Gateway)
#
# SEGURIDAD — OIDC (OpenID Connect):
#   En lugar de guardar AWS_ACCESS_KEY_ID y AWS_SECRET_ACCESS_KEY como secrets
#   (que son credenciales de larga duración y representan un riesgo de seguridad),
#   usamos OIDC. GitHub Actions obtiene un token JWT temporal de GitHub y lo
#   intercambia con AWS STS por credenciales temporales (válidas ~1 hora).
#   ZERO access keys estáticas en el repositorio.
#
# PRERREQUISITOS (configurar una sola vez en AWS + GitHub):
#   1. Identity Provider OIDC en AWS IAM (token.actions.githubusercontent.com)
#   2. IAM Role con política de confianza hacia GitHub Actions
#   3. Secrets en el repositorio GitHub:
#      - AWS_ROLE_ARN: ARN del IAM Role creado en el paso 2
#      - AWS_REGION: us-east-1
#      - SAM_BUCKET: msg-pipeline-artifacts-629742034427
# =============================================================================

name: Deploy msg-pipeline-processor-sesion-08

# TRIGGER: El pipeline se activa solo con push a la rama 'main'.
# Evitamos deploys accidentales desde ramas de desarrollo.
on:
  push:
    branches:
      - main
    # Opcional: activar solo cuando cambian archivos relevantes
    # paths:
    #   - 'src/**'
    #   - 'template.yaml'
    #   - 'build.gradle'

  # Permite ejecutar el pipeline manualmente desde la UI de GitHub Actions
  workflow_dispatch:
    inputs:
      environment:
        description: 'Entorno de despliegue'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod
          - dev

# PERMISOS: Define exactamente qué puede hacer este pipeline.
# id-token: write → necesario para el flujo OIDC (solicitar el JWT de GitHub)
# contents: read  → necesario para hacer checkout del código
permissions:
  id-token: write  # CRÍTICO: sin este permiso, OIDC no funciona
  contents: read

# Variables de entorno globales disponibles en todos los pasos
env:
  JAVA_VERSION: '17'
  DISTRIBUTION: 'temurin'  # Eclipse Temurin (anteriormente AdoptOpenJDK)
  SAM_STACK_NAME: 'msg-pipeline-stack-sesion-08'

jobs:
  # ===========================================================================
  # JOB: deploy — Compilar y desplegar en AWS
  # ===========================================================================
  deploy:
    name: Build & Deploy to AWS
    runs-on: ubuntu-latest  # Runner de GitHub (Ubuntu 22.04 LTS)

    steps:
      # ── Paso 1: Checkout ────────────────────────────────────────────────────
      # Descarga el código del repositorio en el runner de GitHub.
      # fetch-depth: 0 descarga todo el historial (necesario para algunos análisis).
      - name: 📥 Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Paso 2: Configurar Java 17 ──────────────────────────────────────────
      # Instala el JDK 17 en el runner.
      # 'temurin' es la distribución OpenJDK de Eclipse Foundation (gratuita y LTS).
      # cache: 'gradle' almacena en caché las dependencias de Gradle entre ejecuciones,
      # reduciendo el tiempo de build de ~3 min a ~30 segundos después del primer run.
      - name: ☕ Configurar Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.DISTRIBUTION }}
          cache: 'gradle'

      # ── Paso 3: Configurar credenciales AWS via OIDC ────────────────────────
      # CONCEPTO OIDC:
      #   1. GitHub Actions genera un JWT firmado por GitHub (token de identidad)
      #   2. aws-actions/configure-aws-credentials envía ese JWT a AWS STS
      #   3. AWS STS valida el JWT contra el Identity Provider OIDC registrado
      #   4. AWS STS devuelve credenciales temporales (Access Key + Secret + Session Token)
      #   5. Las credenciales temporales expiran en ~1 hora (seguras por naturaleza)
      #
      # VENTAJA vs Access Keys estáticas:
      #   - Sin credenciales de larga duración en secrets de GitHub
      #   - Si el runner se compromete, las credenciales expiran pronto
      #   - El role-to-assume define exactamente qué puede hacer el pipeline
      - name: 🔐 Configurar credenciales AWS (OIDC - Sin Access Keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # ARN del IAM Role que el pipeline va a asumir
          # Configurado en GitHub Secrets → Settings → Secrets and variables → Actions
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

          # Región AWS donde se desplegará la aplicación
          aws-region: ${{ secrets.AWS_REGION }}

          # Tiempo de validez de las credenciales temporales (segundos)
          # 3600 = 1 hora, suficiente para compilar y desplegar
          role-duration-seconds: 3600

          # Nombre de la sesión (aparece en los logs de CloudTrail para auditoría)
          role-session-name: GitHubActions-msg-pipeline-sesion-08

      # ── Paso 4: Verificar conexión con AWS ──────────────────────────────────
      # Paso de diagnóstico: confirma que las credenciales OIDC funcionan.
      # Si este paso falla, hay un problema con el Role ARN o el Identity Provider.
      - name: 🔍 Verificar identidad AWS
        run: aws sts get-caller-identity

      # ── Paso 5: Permisos de ejecución para gradlew ──────────────────────────
      # En Linux/macOS, los archivos ejecutables necesitan permisos de ejecución.
      # Git no siempre preserva estos permisos al hacer checkout en Windows.
      # Este paso garantiza que gradlew sea ejecutable en el runner Ubuntu.
      - name: 🔑 Dar permisos de ejecución a gradlew
        run: chmod +x gradlew

      # ── Paso 6: Compilar y generar artefacto ────────────────────────────────
      # CONCEPTO: El buildZip de Gradle genera el ZIP con el formato correcto para Lambda:
      #   - Clases del proyecto en la raíz del ZIP
      #   - Dependencias en la carpeta lib/ (sin descomprimir)
      #
      # --no-daemon: deshabilita el Gradle Daemon en CI (el daemon está optimizado
      # para desarrollo local con builds repetidos, no para CI con builds únicos).
      # Sin --no-daemon, el daemon a veces queda en estado inconsistente en CI.
      - name: 🏗️ Compilar con Gradle y generar ZIP Lambda
        run: ./gradlew clean buildZip --no-daemon --stacktrace

      # ── Paso 7: Verificar artefacto generado ────────────────────────────────
      # Verifica que el ZIP fue generado correctamente antes de continuar.
      # Un ZIP corrupto o vacío causaría un error críptico en sam deploy.
      - name: 📦 Verificar artefacto ZIP
        run: |
          ls -lh build/distributions/
          if [ ! -f "build/distributions/msg-pipeline-processor-lambda.zip" ]; then
            echo "❌ ERROR: El ZIP de Lambda no fue generado"
            exit 1
          fi
          echo "✅ ZIP generado correctamente"
          unzip -l build/distributions/msg-pipeline-processor-lambda.zip | head -20

      # ── Paso 8: Instalar AWS SAM CLI ────────────────────────────────────────
      # El runner de GitHub Ubuntu no incluye SAM CLI por defecto.
      # Instalamos la versión más reciente disponible en pip.
      # Alternativa: usar la GitHub Action oficial de AWS: aws-actions/setup-sam
      - name: 📦 Instalar AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      # ── Paso 9: Verificar SAM CLI ────────────────────────────────────────────
      - name: 🔍 Verificar versión de SAM CLI
        run: sam --version

      # ── Paso 10: sam build ──────────────────────────────────────────────────
      # CONCEPTO: 'sam build' prepara el artefacto para el despliegue.
      # Para Java con buildZip (no nativo), sam build principalmente:
      #   1. Lee el template.yaml y valida la sintaxis
      #   2. Copia el artefacto al directorio .aws-sam/build/
      #   3. Prepara los metadatos para sam deploy
      #
      # --use-container: compila dentro de un contenedor Docker con el runtime
      # de Lambda (java17). Garantiza compatibilidad binaria.
      # Para JARs pre-compilados con buildZip, no es necesario pero es buena práctica.
      - name: 🔨 SAM Build
        run: sam build --template template.yaml

      # ── Paso 11: sam deploy ──────────────────────────────────────────────────
      # CONCEPTO: 'sam deploy' realiza el despliegue en AWS:
      #   1. Sube el artefacto ZIP al bucket S3 (ArtifactsBucketName)
      #   2. Crea o actualiza el CloudFormation Stack
      #   3. CloudFormation crea/actualiza los recursos (Lambda, SQS, DynamoDB, etc.)
      #   4. Espera a que el stack termine (COMPLETE o ROLLBACK)
      #
      # --no-confirm-changeset: no pide confirmación interactiva (requerido en CI)
      # --no-fail-on-empty-changeset: no falla si no hay cambios (idempotente)
      # --capabilities CAPABILITY_IAM: autoriza a CloudFormation crear roles IAM
      # --capabilities CAPABILITY_NAMED_IAM: autoriza nombres personalizados en roles IAM
      #   (necesario porque nuestros roles tienen nombres explícitos como
      #    msg-pipeline-apigw-sqs-role-sesion-08)
      - name: 🚀 SAM Deploy
        run: |
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name ${{ env.SAM_STACK_NAME }} \
            --s3-bucket ${{ secrets.SAM_BUCKET }} \
            --s3-prefix sesion-08 \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "Environment=prod" \
              "ArtifactsBucketName=${{ secrets.SAM_BUCKET }}" \
            --tags \
              "Proyecto=msg-pipeline" \
              "Sesion=08" \
              "Curso=SpringBoot-AWS-Serverless" \
              "ManagedBy=GitHubActions"

      # ── Paso 12: Mostrar los Outputs del stack ───────────────────────────────
      # CloudFormation Outputs contienen las URLs y ARNs de los recursos creados.
      # Útil para saber la URL del API Gateway después del despliegue.
      - name: 📋 Mostrar Outputs del Stack
        run: |
          echo "=== Outputs del Stack CloudFormation ==="
          aws cloudformation describe-stacks \
            --stack-name ${{ env.SAM_STACK_NAME }} \
            --query "Stacks[0].Outputs" \
            --output table

      # ── Paso 13 (opcional): Notificación de éxito ────────────────────────────
      # En un proyecto real, aquí se enviaría una notificación a Slack/Teams.
      - name: ✅ Despliegue exitoso
        run: |
          echo "🎉 Despliegue de msg-pipeline-processor-sesion-08 completado"
          echo "📅 Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "🌿 Branch: ${{ github.ref_name }}"
          echo "📝 Commit: ${{ github.sha }}"

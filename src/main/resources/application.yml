# =============================================================================
# application.yml — msg-pipeline-processor-sesion-06
# =============================================================================
#
# ROL: Processor Lambda — invocado por Step Functions Task "InvocarLambda"
#      Guarda en DynamoDB (PENDING) y publica en SNS
#
# DIFERENCIA CON SESION 05:
#   Sesion 05: Processor recibía HTTP POST de API Gateway
#   Sesion 06: Processor recibe input JSON de Step Functions
# =============================================================================

spring:
  application:
    name: msg-pipeline-processor-sesion-06

app:
  aws:
    region: ${AWS_REGION_NAME:us-east-1}
    dynamodb-table: ${DYNAMODB_TABLE_NAME:msg-pipeline-messages}
    sns-topic-arn: ${SNS_TOPIC_ARN:}

  processor:
    ttl-days: 30

logging:
  level:
    com.msgpipeline: INFO
    software.amazon.awssdk: WARN

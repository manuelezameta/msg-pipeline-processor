# =============================================================================
# application.yml — Configuración base del msg-pipeline-processor (Sesión 04)
# =============================================================================
#
# PRINCIPIO: Separación de configuración por entorno (12-Factor App, Factor III)
#
# Este archivo define los valores COMUNES a todos los perfiles.
# Los valores específicos por entorno se definen en:
#   application-local.yml → perfil 'local' (desarrollo en macOS)
#   application-aws.yml   → perfil 'aws'   (Lambda en AWS)
#
# VARIABLES DE ENTORNO:
#   ${VARIABLE:default} → usa la variable de entorno si existe, sino el default
#   Esto permite que el mismo código funcione local y en Lambda sin cambios.
# =============================================================================

spring:
  application:
    name: msg-pipeline-processor-sesion-04

# ─── Configuración de la aplicación ─────────────────────────────────────────
app:
  aws:
    # Región de AWS donde están desplegados los servicios
    # En Lambda: la variable AWS_REGION la inyecta el runtime automáticamente
    region: ${AWS_REGION_NAME:us-east-1}

    # Nombre de la tabla DynamoDB donde se persisten los mensajes
    # En Lambda: configurar como variable de entorno DYNAMODB_TABLE_NAME
    dynamodb-table: ${DYNAMODB_TABLE_NAME:msg-pipeline-messages}

    # ARN del tópico SNS para notificaciones de procesamiento (Sesión 04 — NUEVO)
    # Patrón Observer: el procesador publica aquí; SNS distribuye a suscriptores.
    # En Lambda: configurar como variable de entorno SNS_TOPIC_ARN
    # Si está vacío, se omite la notificación (compatible con Sesión 03).
    sns-topic-arn: ${SNS_TOPIC_ARN:}

  # Configuración del procesador de mensajes
  processor:
    # Tiempo máximo de reintentos antes de enviar a DLQ (informativo)
    max-retries: 3
    # Días de retención del mensaje en DynamoDB (TTL)
    ttl-days: 30

# ─── SpringDoc / Swagger ─────────────────────────────────────────────────────
# Disponible solo con el perfil 'local'.
# En producción (Lambda) Swagger no aplica porque no hay servidor HTTP.
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /v3/api-docs

# ─── Logging ─────────────────────────────────────────────────────────────────
logging:
  level:
    com.msgpipeline: INFO
    software.amazon.awssdk: WARN

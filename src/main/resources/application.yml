# =============================================================================
# application.yml — Configuración base del msg-pipeline-processor-sesion-05
# =============================================================================
#
# CAMBIOS EN SESIÓN 05:
#   + app.aws.event-bus-name: bus de EventBridge para eventos de dominio
#   + Trigger cambiado: SQS → API Gateway (sin configuración de SQS aquí)
#
# PERFIL ACTIVO:
#   local: ./gradlew bootRun --args='--spring.profiles.active=local'
#   aws:   ProcessorHandler.java → new SpringApplicationBuilder(...).profiles("aws")
# =============================================================================

spring:
  application:
    name: msg-pipeline-processor-sesion-05

app:
  aws:
    region: ${AWS_REGION_NAME:us-east-1}
    dynamodb-table: ${DYNAMODB_TABLE_NAME:msg-pipeline-messages}
    # NUEVO Sesión 05: Bus de EventBridge para eventos de dominio
    # En Lambda: configurar como variable de entorno EVENT_BUS_NAME
    event-bus-name: ${EVENT_BUS_NAME:msg-pipeline-events-sesion-05}

  processor:
    max-retries: 3
    ttl-days: 30

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.msgpipeline: INFO
    software.amazon.awssdk: WARN
